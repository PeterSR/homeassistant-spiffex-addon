name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: App configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./spiffex_agent

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s bash spiffex_agent/rootfs/etc/s6-overlay/s6-rc.d/spiffex-agent/run spiffex_agent/rootfs/etc/s6-overlay/s6-rc.d/spiffex-agent/finish
