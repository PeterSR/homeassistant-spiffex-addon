name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/petersr/homeassistant-spiffex-agent

jobs:
  build:
    # Pull requests only build, with read-only permissions.
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: spiffex_agent
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the release commit
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version
        id: version
        run: |
          echo "version=$(yq -r '.version' spiffex_agent/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Never overwrite a published image: users who installed that version must keep getting
      # exactly that image. Publish only on a definite "not found"; any other error fails the job.
      - name: Decide whether to publish
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "${IMAGE}:${VERSION} already exists; not publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|manifest unknown|name unknown" <<<"${out}"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not tell whether ${IMAGE}:${VERSION} exists:" >&2
            echo "${out}" >&2
            exit 1
          fi

      - uses: docker/build-push-action@v7
        with:
          context: spiffex_agent
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

      # Also run when the image already exists, so a tag push that failed after a publish is
      # retried on the next run. The tag goes on the commit the image was built from, read from
      # its revision label, not on whatever main is now.
      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already tagged"
            exit 0
          fi
          revision="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ json .Image }}' \
            | jq -r '."linux/amd64".config.Labels."org.opencontainers.image.revision" // empty')"
          if [[ -z "${revision}" ]]; then
            echo "${IMAGE}:${VERSION} has no revision label; not guessing which commit to tag" >&2
            exit 1
          fi
          git fetch --quiet origin "${revision}"
          git tag "v${VERSION}" "${revision}"
          git push origin "v${VERSION}"
