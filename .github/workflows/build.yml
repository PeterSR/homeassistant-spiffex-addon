name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/petersr/homeassistant-spiffex-agent

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the release commit
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the app version
        id: version
        run: echo "version=$(yq -r '.version' spiffex_agent/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish only from main, and never overwrite an image that was already published: users who
      # installed that version must keep getting exactly that image.
      - name: Decide whether to publish
        id: publish
        run: |
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]]; then
            if docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "${IMAGE}:${{ steps.version.outputs.version }} already exists; not publishing"
            else
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: spiffex_agent
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Tag the release
        if: steps.publish.outputs.publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "${tag}"
          git push origin "${tag}"
