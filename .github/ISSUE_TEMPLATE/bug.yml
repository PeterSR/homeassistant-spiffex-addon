name: Bug report
description: The app does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a private key or a token. The public key in the log is fine to share.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App version, Home Assistant version and architecture
      placeholder: 0.1.0, 2026.11.0, aarch64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The app's log
      render: text
